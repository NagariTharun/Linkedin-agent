name: Daily LinkedIn Post Generator

on:
  workflow_dispatch: # Allows you to click a button to test it manually anytime!
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9:00 AM UTC automatically

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
